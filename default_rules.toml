# Pint - Default Merchant Rules
#
# Each rule maps a pattern to a category.
# Matching is case-insensitive.
#
# Match modes:
# - substring (default): pattern appears anywhere in the description
# - token: pattern must be bounded by non-alphanumeric characters (avoids matching inside words, e.g. "IRS" in "FIRST")
# Edit this file to customize your categorization rules.
# Run `pint import-rules` after editing to reload.

